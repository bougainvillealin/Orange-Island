name: Build APK

on:
  push:
    branches: [pink-hook]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply overlay (our changes)
        run: |
          if [ -f overlay.zip ]; then
            unzip -o overlay.zip -d .
            echo "overlay applied"
          else
            echo "no overlay.zip, building original code"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build F-Droid Debug APK
        run: chmod +x ./gradlew && ./gradlew assembleFdroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangeisland-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
